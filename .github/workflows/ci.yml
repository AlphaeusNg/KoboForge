name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EPUBCHECK_VERSION: "5.3.0"
  EPUBCHECK_SHA256: 6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download verified EPUBCheck
        run: |
          curl -fsSL --retry 3 \
            -o /tmp/koboforge-epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          printf '%s  %s\n' "$EPUBCHECK_SHA256" /tmp/koboforge-epubcheck.zip | sha256sum --check
          mkdir -p /tmp/koboforge-epubcheck
          unzip -q /tmp/koboforge-epubcheck.zip -d /tmp/koboforge-epubcheck
      - name: Standards-check reflowable fixture
        env:
          EPUBCHECK_JAR: /tmp/koboforge-epubcheck/epubcheck-${{ env.EPUBCHECK_VERSION }}/epubcheck.jar
        run: node tools/test_epub_package.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser import/edit/export smoke
        run: npm run test:browser
      - name: JavaScript syntax
        run: find js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
