name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser import/edit/export smoke
        run: npm run test:browser
      - name: JavaScript syntax
        run: find js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
